<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><title>Registro | The Coffee Shop</title></head><body><nav><span class="logo">The Coffee Shop</span><ul><li><a href="index.html">Inicio</a></li><li><a href="registro.html" class="activo">Registro</a></li><li><a href="nosotros.html">Quiénes somos</a></li><li><a href="catalogo.html">Catálogo</a></li><li><a href="carrito.html">Carrito <span id="contador">0</span></a></li><li><a href="busqueda.html">Búsqueda</a></li></ul></nav><header class="titulo"><h1>Crea tu cuenta</h1><p>Regístrate para recibir promociones de la casa.</p></header><main><form class="formulario" id="form-registro" novalidate>
<div><label for="nombre">Nombre completo</label><input type="text" id="nombre" name="nombre"></div>
<div><label for="email">Correo electrónico</label><input type="email" id="email" name="email" pattern="[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}" title="Escribe un correo válido, por ejemplo nombre@correo.com"></div>
<div><label for="clave">Contraseña</label><input type="password" id="clave" name="clave"></div>
<div><label for="fecha">Fecha de nacimiento</label><input type="date" id="fecha" name="fecha"></div>
<div><label for="tel">Teléfono (10 dígitos)</label><input type="tel" id="tel" name="tel" pattern="[0-9]{10}" title="Escribe 10 dígitos, sin espacios"></div>
<div class="check"><label for="terminos"><input type="checkbox" id="terminos" name="terminos"> Acepto los términos y condiciones</label></div>
<button type="submit" class="btn" id="btn-registro" disabled>Registrarme</button>
<p class="aviso" id="msg-registro" role="alert"></p></form></main><footer>Proyecto escolar · <a href="https://github.com/rubiesmeralda826-svg/cafeteria_prog_web1" target="_blank" rel="noopener">Repositorio</a> · <a href="https://rubiesmeralda826-svg.github.io/cafeteria_prog_web1/index.html">Sitio publicado</a></footer><div id="mensaje" role="status"></div><script src="script.js"></script></body></html>
